# SalesAlpha CRM application API: the same document as sales-alpha-api.openapi.json, written in YAML.
openapi: '3.0.3'
info:
  title: SalesAlpha Boarding API
  version: '2026.3'
paths:
  /applications:
    post:
      operationId: submitApplication
      summary: Submit a merchant application for boarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/Application'
      responses:
        '202':
          description: Accepted
  '/applications/{id}/owners':
    put:
      operationId: replaceOwners
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                '$ref': '#/components/schemas/owner'
      responses:
        '204':
          description: Replaced
  '/applications/{id}':
    get:
      operationId: getApplication
      responses:
        '200':
          description: OK
components:
  schemas:
    Application:
      type: object
      required:
        - applicationId
        - submittedAt
        - account
        - owners
        - processing
        - bank
      properties:
        applicationId:
          type: string
          maxLength: 20
          description: CRM application identifier.
        submittedAt:
          type: string
          format: date-time
        account:
          '$ref': '#/components/schemas/account'
        owners:
          type: array
          minItems: 1
          maxItems: 4
          items:
            '$ref': '#/components/schemas/owner'
        processing:
          type: object
          required:
            - annualCardVolume
            - averageTicket
            - cardPresentPercent
            - motoPercent
            - ecommPercent
          properties:
            annualCardVolume:
              type: number
              minimum: 0
              description: 'Expected card volume per year, in USD.'
            averageTicket:
              type: number
              minimum: 0
              multipleOf: 0.01
            cardPresentPercent:
              '$ref': '#/components/schemas/percent'
            motoPercent:
              '$ref': '#/components/schemas/percent'
            ecommPercent:
              '$ref': '#/components/schemas/percent'
        bank:
          type: object
          required:
            - routingNumber
            - accountNumber
          properties:
            routingNumber:
              type: string
              minLength: 9
              maxLength: 9
            accountNumber:
              type: string
              minLength: 4
              maxLength: 17
    account:
      type: object
      required:
        - legalName
        - taxId
        - entityType
        - mcc
        - address
      properties:
        legalName:
          type: string
          maxLength: 120
        dbaName:
          type: string
          maxLength: 120
        taxId:
          type: string
          description: 'EIN, or the owner''s SSN for sole proprietors.'
        entityType:
          enum:
            - CORP
            - LLC
            - PARTNERSHIP
            - SOLE_PROP
            - NON_PROFIT
          type: string
        mcc:
          type: string
          minLength: 4
          maxLength: 4
        incorporationDate:
          type: string
          format: date
        phone:
          type: string
        salesRepId:
          type: string
        leadSource:
          type: string
        address:
          '$ref': '#/components/schemas/address'
    address:
      type: object
      required:
        - line1
        - city
        - state
        - postalCode
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
        postalCode:
          type: string
    owner:
      type: object
      required:
        - firstName
        - lastName
        - ownershipPercent
        - ssn
        - dateOfBirth
      properties:
        firstName:
          type: string
        lastName:
          type: string
        title:
          type: string
        ownershipPercent:
          type: number
          minimum: 0
          maximum: 1
          description: 'Share of the business as a fraction (0.25 = 25%).'
        ssn:
          type: string
        dateOfBirth:
          type: string
          format: date
        email:
          type: string
          format: email
    percent:
      type: integer
      minimum: 0
      maximum: 100
