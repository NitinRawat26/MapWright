# Domain playbook: Business.
# Edit a draft in the MapWright UI, or edit this file and check it with: mapwright playbook test playbooks
# Values that look like numbers or dates (versions, dates, codes) are quoted so every YAML tool reads them as text.

specVersion: "1.0"
id: domain/business
name: Business
kind: domain
version: "1.0.0"
status: published
owner: Underwriting BA team
description: The merchant business being boarded — its legal and DBA (trading) names, addresses, phone numbers and government registration identifiers.
changeNotes:
  - version: "1.0.0"
    date: "2026-09-27"
    author: Devin
    description: Initial version.
domain:
  concept:
    name: Business
    description: The business entity being boarded.
    attributes:
      - name: LegalName
        description: Registered legal name of the business.
        dataType: string
      - name: DBAName
        description: Trading / doing-business-as name.
        dataType: string
      - name: LegalAddress
        description: Registered legal address of the business.
        dataType: object
        sensitivity: pii
      - name: DBAAddress
        description: Address the DBA trades from; may differ from the legal address.
        dataType: object
        sensitivity: pii
      # Address parts are leaf attributes because detection only sees value fields; the legal/DBA
      # variant is chosen by an ancestor context signal, not by the leaf name itself.
      - name: LegalAddressLine1
        description: First line of the registered legal address.
        dataType: string
        sensitivity: pii
      - name: LegalAddressLine2
        description: Second line of the registered legal address.
        dataType: string
        sensitivity: pii
      - name: LegalAddressLine3
        description: Third line of the registered legal address.
        dataType: string
        sensitivity: pii
      - name: LegalCity
        description: City of the registered legal address.
        dataType: string
        sensitivity: pii
      - name: LegalStateProvince
        description: State or province of the registered legal address.
        dataType: string
        sensitivity: pii
      - name: LegalCountry
        description: Country of the registered legal address.
        dataType: string
        sensitivity: pii
      - name: LegalPostalCode
        description: Postal code of the registered legal address.
        dataType: string
        sensitivity: pii
      - name: DBAAddressLine1
        description: First line of the trading address.
        dataType: string
        sensitivity: pii
      - name: DBAAddressLine2
        description: Second line of the trading address.
        dataType: string
        sensitivity: pii
      - name: DBAAddressLine3
        description: Third line of the trading address.
        dataType: string
        sensitivity: pii
      - name: DBACity
        description: City of the trading address.
        dataType: string
        sensitivity: pii
      - name: DBAStateProvince
        description: State or province of the trading address.
        dataType: string
        sensitivity: pii
      - name: DBACountry
        description: Country of the trading address.
        dataType: string
        sensitivity: pii
      - name: DBAPostalCode
        description: Postal code of the trading address.
        dataType: string
        sensitivity: pii
      - name: LegalTelephoneNumber
        description: Main telephone number on record for the legal entity.
        dataType: string
        sensitivity: pii
      - name: DBATelephoneNumber
        description: Telephone number of the trading location.
        dataType: string
        sensitivity: pii
      - name: GovernmentalIdentifier
        description: Government-issued registration identifier (business registration number, company number).
        dataType: string
  # Names systems use for the concept or one of its attributes; relation is equivalent unless stated.
  vocabulary:
    - term: business
    - term: merchant
    - term: company
    - term: legal entity
    - term: applicant
    - term: organization
      relation: related
    - term: customer
      relation: related
    - term: account
      relation: related
    - term: legal name
      appliesTo: LegalName
    - term: legal business name
      appliesTo: LegalName
    - term: registered name
      appliesTo: LegalName
    - term: entity name
      appliesTo: LegalName
    - term: corporate name
      appliesTo: LegalName
    - term: business name
      appliesTo: LegalName
      relation: related
      note: Ambiguous — may be the DBA name rather than the legal name.
    - term: dba
      appliesTo: DBAName
    - term: dba name
      appliesTo: DBAName
    - term: doing business as
      appliesTo: DBAName
    - term: trade name
      appliesTo: DBAName
    - term: trading name
      appliesTo: DBAName
    - term: trading as
      appliesTo: DBAName
    - term: fictitious name
      appliesTo: DBAName
    - term: assumed name
      appliesTo: DBAName
    - term: brand name
      appliesTo: DBAName
      relation: related
    - term: legal address
      appliesTo: LegalAddress
    - term: registered address
      appliesTo: LegalAddress
    - term: registered office
      appliesTo: LegalAddress
    - term: principal address
      appliesTo: LegalAddress
    - term: corporate address
      appliesTo: LegalAddress
    - term: business address
      appliesTo: LegalAddress
      relation: related
      note: Ambiguous — may be the trading address.
    - term: mailing address
      appliesTo: LegalAddress
      relation: related
    - term: dba address
      appliesTo: DBAAddress
    - term: trade address
      appliesTo: DBAAddress
    - term: trading address
      appliesTo: DBAAddress
    - term: location address
      appliesTo: DBAAddress
    - term: site address
      appliesTo: DBAAddress
    - term: store address
      appliesTo: DBAAddress
    - term: shop address
      appliesTo: DBAAddress
    # Address-part terms are generic ("address1", "city", "zip" appear under both legal and DBA
    # parents), so they are `related` for both sides; ancestor signals decide which side wins.
    - term: address line 1
      appliesTo: LegalAddressLine1
      relation: related
    - term: address line 1
      appliesTo: DBAAddressLine1
      relation: related
    - term: address line
      appliesTo: LegalAddressLine1
      relation: related
    - term: address line
      appliesTo: DBAAddressLine1
      relation: related
    - term: address1
      appliesTo: LegalAddressLine1
      relation: related
    - term: address1
      appliesTo: DBAAddressLine1
      relation: related
    - term: addr1
      appliesTo: LegalAddressLine1
      relation: related
    - term: addr1
      appliesTo: DBAAddressLine1
      relation: related
    - term: street address
      appliesTo: LegalAddressLine1
      relation: related
    - term: street address
      appliesTo: DBAAddressLine1
      relation: related
    - term: street
      appliesTo: LegalAddressLine1
      relation: related
    - term: street
      appliesTo: DBAAddressLine1
      relation: related
    - term: address line 2
      appliesTo: LegalAddressLine2
      relation: related
    - term: address line 2
      appliesTo: DBAAddressLine2
      relation: related
    - term: address2
      appliesTo: LegalAddressLine2
      relation: related
    - term: address2
      appliesTo: DBAAddressLine2
      relation: related
    - term: addr2
      appliesTo: LegalAddressLine2
      relation: related
    - term: addr2
      appliesTo: DBAAddressLine2
      relation: related
    - term: suite
      appliesTo: LegalAddressLine2
      relation: related
    - term: suite
      appliesTo: DBAAddressLine2
      relation: related
    - term: unit
      appliesTo: LegalAddressLine2
      relation: related
    - term: unit
      appliesTo: DBAAddressLine2
      relation: related
    - term: address line 3
      appliesTo: LegalAddressLine3
      relation: related
    - term: address line 3
      appliesTo: DBAAddressLine3
      relation: related
    - term: address3
      appliesTo: LegalAddressLine3
      relation: related
    - term: address3
      appliesTo: DBAAddressLine3
      relation: related
    - term: city
      appliesTo: LegalCity
      relation: related
    - term: city
      appliesTo: DBACity
      relation: related
    - term: town
      appliesTo: LegalCity
      relation: related
    - term: town
      appliesTo: DBACity
      relation: related
    - term: municipality
      appliesTo: LegalCity
      relation: related
    - term: municipality
      appliesTo: DBACity
      relation: related
    - term: state
      appliesTo: LegalStateProvince
      relation: related
    - term: state
      appliesTo: DBAStateProvince
      relation: related
    - term: state province
      appliesTo: LegalStateProvince
      relation: related
    - term: state province
      appliesTo: DBAStateProvince
      relation: related
    - term: province
      appliesTo: LegalStateProvince
      relation: related
    - term: province
      appliesTo: DBAStateProvince
      relation: related
    - term: region
      appliesTo: LegalStateProvince
      relation: related
    - term: region
      appliesTo: DBAStateProvince
      relation: related
    - term: country
      appliesTo: LegalCountry
      relation: related
    - term: country
      appliesTo: DBACountry
      relation: related
    - term: country region
      appliesTo: LegalCountry
      relation: related
    - term: country region
      appliesTo: DBACountry
      relation: related
    - term: postal code
      appliesTo: LegalPostalCode
      relation: related
    - term: postal code
      appliesTo: DBAPostalCode
      relation: related
    - term: postcode
      appliesTo: LegalPostalCode
      relation: related
    - term: postcode
      appliesTo: DBAPostalCode
      relation: related
    - term: zip
      appliesTo: LegalPostalCode
      relation: related
    - term: zip
      appliesTo: DBAPostalCode
      relation: related
    - term: zip code
      appliesTo: LegalPostalCode
      relation: related
    - term: zip code
      appliesTo: DBAPostalCode
      relation: related
    - term: legal phone
      appliesTo: LegalTelephoneNumber
    - term: business phone
      appliesTo: LegalTelephoneNumber
    - term: main phone
      appliesTo: LegalTelephoneNumber
    - term: corporate phone
      appliesTo: LegalTelephoneNumber
    - term: legal telephone
      appliesTo: LegalTelephoneNumber
    - term: primary phone
      appliesTo: LegalTelephoneNumber
      relation: related
    - term: phone
      appliesTo: LegalTelephoneNumber
      relation: related
      note: Bare "phone" may belong to a contact person or the trading location instead.
    - term: telephone
      appliesTo: LegalTelephoneNumber
      relation: related
    - term: dba phone
      appliesTo: DBATelephoneNumber
    - term: location phone
      appliesTo: DBATelephoneNumber
    - term: site phone
      appliesTo: DBATelephoneNumber
    - term: store phone
      appliesTo: DBATelephoneNumber
    - term: shop phone
      appliesTo: DBATelephoneNumber
    - term: branch phone
      appliesTo: DBATelephoneNumber
    - term: government id
      appliesTo: GovernmentalIdentifier
    - term: governmental identifier
      appliesTo: GovernmentalIdentifier
    - term: government identifier
      appliesTo: GovernmentalIdentifier
    - term: federal id
      appliesTo: GovernmentalIdentifier
    - term: business registration number
      appliesTo: GovernmentalIdentifier
    - term: registration id
      appliesTo: GovernmentalIdentifier
    - term: registration number
      appliesTo: GovernmentalIdentifier
    - term: company number
      appliesTo: GovernmentalIdentifier
    - term: state id
      appliesTo: GovernmentalIdentifier
      relation: related
    - term: tax id
      appliesTo: GovernmentalIdentifier
      relation: related
      note: Covered in detail by domain/tax-id.
    - term: license number
      appliesTo: GovernmentalIdentifier
      relation: related
  # Extra evidence: each matching signal adds its weight (negative weights count against a match).
  signals:
    - id: BUS-SIG-CHILDREN
      kind: childNamePattern
      pattern: ^(legal|dba|trade|trading|fictitious)[ _]?(name|address|phone|telephone)|address[ _]?line[ _]?[123]$|^(city|state|province|country|postal[ _]?code|zip)$
      weight: 15
      note: children look like business name / address / phone parts
    - id: BUS-SIG-ADDR-CHILDREN
      kind: childNamePattern
      pattern: ^(address[ _]?line[ _]?[123]|address[123]|line[123]|street|city|state[ _]?province|state|province|country|postal[ _]?code|zip[ _]?code?|zip)$
      appliesTo: LegalAddress
      weight: 15
      note: children look like address parts
    - id: BUS-SIG-DBAADDR-CHILDREN
      kind: childNamePattern
      pattern: ^(address[ _]?line[ _]?[123]|address[123]|line[123]|street|city|state[ _]?province|state|province|country|postal[ _]?code|zip[ _]?code?|zip)$
      appliesTo: DBAAddress
      weight: 15
      note: children look like address parts
    - id: BUS-SIG-ADDR-OBJECT
      kind: dataType
      appliesTo: LegalAddress
      pattern: object
      weight: 10
      note: an address is a structured object
    - id: BUS-SIG-DBAADDR-OBJECT
      kind: dataType
      appliesTo: DBAAddress
      pattern: object
      weight: 10
      note: an address is a structured object
    # Leaf address parts pick their legal/DBA variant from an ancestor naming the identity
    # (LegalAddress, LegalInformation, DbaInformation, storeAddress, …), not from the leaf name.
    - id: BUS-SIG-LEGAL-LINE1
      kind: ancestorNamePattern
      pattern: legal|registered|principal|corporate
      appliesTo: LegalAddressLine1
      weight: 25
    - id: BUS-SIG-DBA-LINE1
      kind: ancestorNamePattern
      pattern: dba|trade|trading|store|shop|site|location|branch
      appliesTo: DBAAddressLine1
      weight: 25
    - id: BUS-SIG-LEGAL-LINE2
      kind: ancestorNamePattern
      pattern: legal|registered|principal|corporate
      appliesTo: LegalAddressLine2
      weight: 25
    - id: BUS-SIG-DBA-LINE2
      kind: ancestorNamePattern
      pattern: dba|trade|trading|store|shop|site|location|branch
      appliesTo: DBAAddressLine2
      weight: 25
    - id: BUS-SIG-LEGAL-LINE3
      kind: ancestorNamePattern
      pattern: legal|registered|principal|corporate
      appliesTo: LegalAddressLine3
      weight: 25
    - id: BUS-SIG-DBA-LINE3
      kind: ancestorNamePattern
      pattern: dba|trade|trading|store|shop|site|location|branch
      appliesTo: DBAAddressLine3
      weight: 25
    - id: BUS-SIG-LEGAL-CITY
      kind: ancestorNamePattern
      pattern: legal|registered|principal|corporate
      appliesTo: LegalCity
      weight: 25
    - id: BUS-SIG-DBA-CITY
      kind: ancestorNamePattern
      pattern: dba|trade|trading|store|shop|site|location|branch
      appliesTo: DBACity
      weight: 25
    - id: BUS-SIG-LEGAL-STATE
      kind: ancestorNamePattern
      pattern: legal|registered|principal|corporate
      appliesTo: LegalStateProvince
      weight: 25
    - id: BUS-SIG-DBA-STATE
      kind: ancestorNamePattern
      pattern: dba|trade|trading|store|shop|site|location|branch
      appliesTo: DBAStateProvince
      weight: 25
    - id: BUS-SIG-LEGAL-COUNTRY
      kind: ancestorNamePattern
      pattern: legal|registered|principal|corporate
      appliesTo: LegalCountry
      weight: 25
    - id: BUS-SIG-DBA-COUNTRY
      kind: ancestorNamePattern
      pattern: dba|trade|trading|store|shop|site|location|branch
      appliesTo: DBACountry
      weight: 25
    - id: BUS-SIG-LEGAL-POSTAL
      kind: ancestorNamePattern
      pattern: legal|registered|principal|corporate
      appliesTo: LegalPostalCode
      weight: 25
    - id: BUS-SIG-DBA-POSTAL
      kind: ancestorNamePattern
      pattern: dba|trade|trading|store|shop|site|location|branch
      appliesTo: DBAPostalCode
      weight: 25
    - id: BUS-SIG-PHONE-VALUE
      kind: valuePattern
      appliesTo: LegalTelephoneNumber
      pattern: ^\+?[0-9 .()\-/]{7,20}$
      weight: 10
      note: digits, spaces, brackets and dashes
    - id: BUS-SIG-DBAPHONE-VALUE
      kind: valuePattern
      appliesTo: DBATelephoneNumber
      pattern: ^\+?[0-9 .()\-/]{7,20}$
      weight: 10
      note: digits, spaces, brackets and dashes
    - id: BUS-SIG-GOVID-SHAPE
      kind: valueShape
      appliesTo: GovernmentalIdentifier
      pattern: ^[Aa]?9[-9]*$
      weight: 10
      note: digits, possibly dashed or letter-prefixed
  confidence:
    # Just above bare term+context (35+25=60) so an ancestor naming the identity (legal*/dba*) is
    # required to match: term + context + identity signal = 85; without the signal a "city" under
    # "business" or "name" in a dba block stays below the line.
    matchThreshold: 61
  risks:
    - id: BUS-RISK-LEGAL-VS-DBA
      level: high
      text: Legal and DBA names/addresses are not interchangeable; boarding under the trading name fails KYB registry matching.
    - id: BUS-RISK-PHONE-PII
      appliesTo: LegalTelephoneNumber
      level: medium
      text: 'Sole traders often register home phone and address; treat as personal data in documents and AI prompts.'
    - id: BUS-RISK-GOVID
      appliesTo: GovernmentalIdentifier
      level: medium
      text: Registration number schemes differ by jurisdiction; do not assume a US format for non-US entities.
  reviewGuidance:
    - id: BUS-Q-LEGAL-DBA
      when: nonEquivalentTerm
      question: The field name does not say legal or DBA. Which one does this system send — the registered identity or the trading identity?
    - id: BUS-Q-PHONE-OWNER
      appliesTo: LegalTelephoneNumber
      when: nonEquivalentTerm
      question: Is this the business's main line, or a contact person's number?
    - id: BUS-Q-GOVID-TYPE
      appliesTo: GovernmentalIdentifier
      when: nonEquivalentTerm
      question: Which identifier is this — company registration number, tax id, or a licence number?
  aiGuidance: A business has a legal identity (registered name, registered address, registration number) and a trading identity (DBA name, trading address, trading phone). Keep them distinct — "business name" may mean either. Addresses appear as objects whose parts (addressLine1-3/address1-3, city, state/stateProvince, country, postalCode/zip) are leaf attributes; the legal or DBA variant comes from an ancestor naming the identity (LegalAddress, LegalInformation, DbaInformation, storeAddress), not from the leaf name. GovernmentalIdentifier is the official registration number; tax ids are handled by the tax-id playbook.
  # Fields this playbook must (or must not) recognise; a version can only be published when they pass.
  tests:
    - id: BUS-T-01
      description: A merchant object is the business.
      field:
        name: merchant
        ancestors:
          - $
        kind: object
        dataType: object
        children:
          - legalName
          - dbaName
          - legalAddress
          - governmentalIdentifier
      expect: Business
      minScore: 70
    - id: BUS-T-02
      description: Legal name under the business.
      field:
        name: legalName
        ancestors:
          - business
          - $
      expect: Business.LegalName
      minScore: 80
    - id: BUS-T-03
      description: DBA name under the business.
      field:
        name: dbaName
        ancestors:
          - merchant
          - application
      expect: Business.DBAName
      minScore: 80
    - id: BUS-T-04
      description: Registered address object with address children.
      field:
        name: registeredAddress
        ancestors:
          - business
          - $
        kind: object
        dataType: object
        children:
          - addressLine1
          - city
          - stateProvince
          - postalCode
      expect: Business.LegalAddress
      minScore: 90
    - id: BUS-T-05
      description: Store address object maps to the DBA address.
      field:
        name: storeAddress
        ancestors:
          - merchant
          - $
        kind: object
        dataType: object
        children:
          - line1
          - city
          - zip
      expect: Business.DBAAddress
      minScore: 90
    - id: BUS-T-06
      description: Main phone number.
      field:
        name: businessPhone
        ancestors:
          - business
          - $
        values:
          - "+1 (212) 555-0199"
          - "212-555-0142"
      expect: Business.LegalTelephoneNumber
      minScore: 90
    - id: BUS-T-07
      description: Government registration number.
      field:
        name: registrationNumber
        ancestors:
          - business
          - $
        values:
          - "C4093028"
      expect: Business.GovernmentalIdentifier
      minScore: 80
    - id: BUS-T-08
      description: A principal's first name is not a business field.
      field:
        name: firstName
        ancestors:
          - owners
          - $
      expect: null
    - id: BUS-T-09
      description: A bare email field is not a business attribute.
      field:
        name: email
        ancestors:
          - business
          - $
        values:
          - "owner@shop.example"
      expect: null
    - id: BUS-T-10
      description: Address line 1 under a legal parent is the legal line.
      field:
        name: addressLine1
        ancestors:
          - legalAddress
          - business
          - $
      expect: Business.LegalAddressLine1
      minScore: 55
    - id: BUS-T-11
      description: Address1 under a DBA information block is the DBA line.
      field:
        name: address1
        ancestors:
          - address
          - dbaInformation
          - companyInformation
          - $
      expect: Business.DBAAddressLine1
      minScore: 55
    - id: BUS-T-12
      description: City under a legal information block is the legal city.
      field:
        name: city
        ancestors:
          - address
          - legalInformation
          - companyInformation
          - $
      expect: Business.LegalCity
      minScore: 55
    - id: BUS-T-13
      description: Zip under a store address is the DBA postal code.
      field:
        name: zip
        ancestors:
          - dbaAddress
          - business
          - $
      expect: Business.DBAPostalCode
      minScore: 55
    - id: BUS-T-14
      description: State under a trading address is the DBA state.
      field:
        name: state
        ancestors:
          - tradingAddress
          - merchant
          - $
      expect: Business.DBAStateProvince
      minScore: 55
    - id: BUS-T-15
      description: An owner's home address is not a business address.
      field:
        name: address1
        ancestors:
          - homeAddress
          - owners
          - $
      expect: null
