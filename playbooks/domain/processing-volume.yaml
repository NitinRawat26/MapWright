# Domain playbook: Processing Volume.
# Edit a draft in the MapWright UI, or edit this file and check it with: mapwright playbook test playbooks
# Values that look like numbers or dates (versions, dates, codes) are quoted so every YAML tool reads them as text.

specVersion: "1.0"
id: domain/processing-volume
name: Processing Volume
kind: domain
version: "1.0.0"
status: published
owner: Underwriting BA team
description: 'Expected card sales: total volume per period, average ticket and high ticket.'
changeNotes:
  - version: "1.0.0"
    date: "2026-09-25"
    author: MapWright starter set
    description: Initial version.
domain:
  concept:
    name: ProcessingVolume
    description: How much the merchant expects to process.
    attributes:
      - name: CardVolume
        description: Total card sales for a period.
        dataType: decimal
        sensitivity: financial
      - name: AverageTicket
        description: Average transaction amount.
        dataType: decimal
        sensitivity: financial
      - name: HighTicket
        description: Largest expected single transaction.
        dataType: decimal
        sensitivity: financial
      - name: Seasonal
        description: Whether the merchant's card sales are seasonal.
        dataType: boolean
      - name: SeasonalMonthsOpen
        description: Months per year a seasonal merchant operates.
        dataType: integer
      - name: PeakPeriodDays
        description: Length of the merchant's peak season in days.
        dataType: integer
      - name: PeakPeriodPercent
        description: Share of annual card volume made in the peak period.
        dataType: decimal
  # Names systems use for the concept or one of its attributes; relation is equivalent unless stated.
  vocabulary:
    - term: processing volume
    - term: card processing
    - term: processing
      relation: related
    - term: financials
      relation: related
    - term: sales profile
      relation: related
    - term: card volume
      appliesTo: CardVolume
    - term: sales volume
      appliesTo: CardVolume
    - term: volume
      appliesTo: CardVolume
    - term: card sales
      appliesTo: CardVolume
    - term: tpv
      appliesTo: CardVolume
    - term: total processing volume
      appliesTo: CardVolume
    - term: charge volume
      appliesTo: CardVolume
    - term: gross sales
      appliesTo: CardVolume
      relation: related
      note: May include cash and non-card sales.
    - term: revenue
      appliesTo: CardVolume
      relation: related
      note: May include cash and non-card sales.
    - term: turnover
      appliesTo: CardVolume
      relation: related
    - term: average ticket
      appliesTo: AverageTicket
    - term: avg ticket
      appliesTo: AverageTicket
    - term: average transaction
      appliesTo: AverageTicket
    - term: avg txn
      appliesTo: AverageTicket
    - term: average sale
      appliesTo: AverageTicket
    - term: avg sale
      appliesTo: AverageTicket
    - term: average ticket size
      appliesTo: AverageTicket
    - term: high ticket
      appliesTo: HighTicket
    - term: max ticket
      appliesTo: HighTicket
    - term: maximum ticket
      appliesTo: HighTicket
    - term: highest ticket
      appliesTo: HighTicket
    - term: largest ticket
      appliesTo: HighTicket
    - term: max transaction
      appliesTo: HighTicket
    - term: max txn
      appliesTo: HighTicket
    - term: largest transaction
      appliesTo: HighTicket
    - term: seasonal
      appliesTo: Seasonal
    - term: seasonal business
      appliesTo: Seasonal
    - term: seasonal merchant
      appliesTo: Seasonal
    - term: months open
      appliesTo: SeasonalMonthsOpen
    - term: seasonal months open
      appliesTo: SeasonalMonthsOpen
    - term: months per year
      appliesTo: SeasonalMonthsOpen
    - term: peak period
      appliesTo: PeakPeriodDays
      relation: related
    - term: peak period days
      appliesTo: PeakPeriodDays
    - term: peak period no of days
      appliesTo: PeakPeriodDays
    - term: peak period number of days
      appliesTo: PeakPeriodDays
    - term: peak season days
      appliesTo: PeakPeriodDays
    - term: peak season
      appliesTo: PeakPeriodDays
      relation: related
    - term: peak period percent
      appliesTo: PeakPeriodPercent
    - term: peak period percentage
      appliesTo: PeakPeriodPercent
    - term: peak turnover percentage
      appliesTo: PeakPeriodPercent
    - term: peak season percentage
      appliesTo: PeakPeriodPercent
    - term: american express volume
      appliesTo: CardVolume
    - term: amex volume
      appliesTo: CardVolume
    - term: amex sales volume
      appliesTo: CardVolume
  qualifiers:
    - name: period
      description: The period a volume covers.
      appliesTo:
        - CardVolume
      default: monthly
      values:
        - value: monthly
          terms:
            - monthly
            - month
            - mthly
            - per month
            - mnthly
        - value: annual
          terms:
            - annual
            - annually
            - yearly
            - year
            - yr
            - per annum
            - pa
    - name: cardScheme
      description: Card brand a volume covers, when a system breaks volume out by scheme.
      appliesTo:
        - CardVolume
      values:
        - value: visa
          terms:
            - visa
        - value: mastercard
          terms:
            - mastercard
            - master card
            - mc
        - value: amex
          terms:
            - amex
            - american express
        - value: discover
          terms:
            - discover
        - value: other
          terms:
            - other cards
            - other schemes
    - name: currencyUnit
      description: Major units (dollars) or minor units (cents).
      values:
        - value: major
          terms:
            - dollars
            - usd
            - dollar
        - value: minor
          terms:
            - cents
            - minor units
            - pennies
  # Extra evidence: each matching signal adds its weight (negative weights count against a match).
  signals:
    - id: VOL-SIG-NUM-VOL
      kind: dataType
      appliesTo: CardVolume
      pattern: integer|decimal
      weight: 10
      note: numeric
    - id: VOL-SIG-NUM-AVG
      kind: dataType
      appliesTo: AverageTicket
      pattern: integer|decimal
      weight: 10
      note: numeric
    - id: VOL-SIG-NUM-HIGH
      kind: dataType
      appliesTo: HighTicket
      pattern: integer|decimal
      weight: 10
      note: numeric
    - id: VOL-SIG-TEXT-VOL
      kind: dataType
      appliesTo: CardVolume
      pattern: date|dateTime|boolean
      weight: -30
      note: not a number
    # Text-typed fields are judged by their values: "280,000" is still a volume, "HIGH" is a tier.
    - id: VOL-SIG-TIER-VOL
      kind: valuePattern
      appliesTo: CardVolume
      pattern: ^(?!-?(\d+|\d{1,3}(,\d{3})+)(\.\d+)?$)
      weight: -30
      note: text that is not a number, e.g. a volume tier
    - id: VOL-SIG-BOOL-SEASONAL
      kind: dataType
      appliesTo: Seasonal
      pattern: boolean
      weight: 10
      note: a yes/no flag
    - id: VOL-SIG-PEAKDAYS
      kind: valueRange
      appliesTo: PeakPeriodDays
      minValue: 1
      maxValue: 366
      weight: 10
      note: a day count
    - id: VOL-SIG-PEAKPCT
      kind: valueRange
      appliesTo: PeakPeriodPercent
      minValue: 0
      maxValue: 100
      weight: 10
      note: a share between 0 and 100
    - id: VOL-SIG-MONTHS
      kind: valueRange
      appliesTo: SeasonalMonthsOpen
      minValue: 1
      maxValue: 12
      weight: 10
      note: a month count
  derivations:
    - id: VOL-PERIOD-01
      description: Annual volume to monthly volume.
      output:
        attribute: CardVolume
        qualifiers:
          period: monthly
      inputs:
        - name: annual
          attribute: CardVolume
          qualifiers:
            period: annual
      expression: annual / 12
      transformation: periodConversion
      note: Assumes volume is spread evenly; seasonal merchants may differ.
      examples:
        - inputs:
            annual: 3000000
          expected: 250000
        - inputs:
            annual: 84000
          expected: 7000
    - id: VOL-PERIOD-02
      description: Monthly volume to annual volume.
      output:
        attribute: CardVolume
        qualifiers:
          period: annual
      inputs:
        - name: monthly
          attribute: CardVolume
          qualifiers:
            period: monthly
      expression: monthly * 12
      transformation: periodConversion
      examples:
        - inputs:
            monthly: 250000
          expected: 3000000
    - id: VOL-UNIT-01
      description: Cents to dollars.
      output:
        attribute: CardVolume
        qualifiers:
          currencyUnit: major
      inputs:
        - name: cents
          attribute: CardVolume
          qualifiers:
            currencyUnit: minor
      expression: cents / 100
      transformation: unitConversion
      examples:
        - inputs:
            cents: 12345
          expected: 123.45
  validations:
    - id: VOL-VAL-01
      description: Average ticket cannot be above high ticket.
      inputs:
        - name: avg
          attribute: AverageTicket
        - name: high
          attribute: HighTicket
      expression: avg <= high
      examples:
        - inputs:
            avg: 42.1
            high: 1500
          expected: true
        - inputs:
            avg: 200
            high: 150
          expected: false
    - id: VOL-VAL-02
      description: Volume cannot be negative.
      inputs:
        - name: volume
          attribute: CardVolume
      expression: volume >= 0
      examples:
        - inputs:
            volume: 0
          expected: true
        - inputs:
            volume: -5
          expected: false
  confidence: {}
  risks:
    - id: VOL-RISK-PERIOD
      appliesTo: CardVolume
      level: high
      text: A monthly/annual mix-up changes exposure twelve-fold.
  reviewGuidance:
    - id: VOL-Q-PERIOD
      appliesTo: CardVolume
      when: assumedQualifier
      question: The name does not say monthly or annual. Which period does this volume cover?
    - id: VOL-Q-GROSS
      appliesTo: CardVolume
      when: nonEquivalentTerm
      question: Does this figure include cash or other non-card sales?
  aiGuidance: Card volume is expected card sales for a period. Always establish the period (monthly or annual) and the unit (dollars or cents). Gross sales and revenue may include non-card sales.
  # Fields this playbook must (or must not) recognise; a version can only be published when they pass.
  tests:
    - id: VOL-T-01
      description: Annual card volume.
      field:
        name: annualCardVolume
        ancestors:
          - processing
          - $
        dataType: integer
        minValue: 84000
        maxValue: 3000000
      expect: ProcessingVolume.CardVolume
      expectQualifiers:
        period: annual
      minScore: 90
      expectReview: false
    - id: VOL-T-02
      description: Monthly volume.
      field:
        name: MonthlyVolume
        ancestors:
          - Processing
          - UnderwritingRequest
        dataType: decimal
      expect: ProcessingVolume.CardVolume
      expectQualifiers:
        period: monthly
      minScore: 90
      expectReview: false
    - id: VOL-T-03
      description: 'No period in the name: assume monthly and ask.'
      field:
        name: cardVolume
        ancestors:
          - processing
        dataType: decimal
      expect: ProcessingVolume.CardVolume
      expectQualifiers:
        period: monthly
      expectReview: true
    - id: VOL-T-04
      description: Average ticket.
      field:
        name: averageTicket
        ancestors:
          - processing
          - $
        dataType: decimal
      expect: ProcessingVolume.AverageTicket
      minScore: 90
    - id: VOL-T-05
      description: High ticket.
      field:
        name: HighTicket
        ancestors:
          - Processing
        dataType: decimal
      expect: ProcessingVolume.HighTicket
      minScore: 90
    - id: VOL-T-06
      description: A volume tier is not a volume.
      field:
        name: volumeTier
        values:
          - LOW
          - HIGH
      expect: null
    - id: VOL-T-08
      description: Volume sent as text with thousands separators is still a volume.
      field:
        name: annualCardVolume
        ancestors:
          - processing
        dataType: string
        values:
          - "280,000"
          - "1,250,000.50"
      expect: ProcessingVolume.CardVolume
      expectQualifiers:
        period: annual
      minScore: 85
    - id: VOL-T-07
      description: Gross sales is related, so it needs review.
      field:
        name: grossSalesYearly
        ancestors:
          - financials
        dataType: decimal
      expect: ProcessingVolume.CardVolume
      expectQualifiers:
        period: annual
      expectReview: true
    - id: VOL-T-09
      description: Peak season length in days.
      field:
        name: PeakPeriodNoOfDays
        ancestors:
          - CustomMarkers
        dataType: integer
        minValue: 30
        maxValue: 120
      expect: ProcessingVolume.PeakPeriodDays
      minScore: 70
    - id: VOL-T-10
      description: Seasonal flag.
      field:
        name: Seasonal
        ancestors:
          - CustomMarkers
        dataType: boolean
      expect: ProcessingVolume.Seasonal
      minScore: 70
    - id: VOL-T-11
      description: Amex volume carries the card-scheme qualifier.
      field:
        name: amexVolume
        ancestors:
          - processing
        dataType: decimal
      expect: ProcessingVolume.CardVolume
      expectQualifiers:
        cardScheme: amex
    - id: VOL-T-12
      description: Months a seasonal merchant operates.
      field:
        name: SeasonalMonthsOpen
        ancestors:
          - CustomMarkers
        dataType: integer
        minValue: 6
        maxValue: 10
      expect: ProcessingVolume.SeasonalMonthsOpen
      minScore: 70
    - id: VOL-T-13
      description: A yes/no flag is not a day count.
      field:
        name: PeakPeriodFlag
        dataType: boolean
      expect: null
