  qualifiers:
    - name: unit
      description: Share expressed as a percent (0–100) or a fraction (0–1).
      appliesTo:
        - OwnershipPercent
      values:
        - value: fraction
          terms:
            - fraction
            - ratio
            - decimal share
          minValue: 0
          maxValue: 1
        - value: percent
          terms:
            - percent
            - pct
            - percentage
            - perc
          minValue: 0
          maxValue: 100
  # Extra evidence: each matching signal adds its weight (negative weights count against a match).
  signals:
    - id: OWN-SIG-LIST
      kind: cardinality
      pattern: array
      weight: 15
      note: owners usually arrive as a list
    - id: OWN-SIG-CHILDREN
      kind: childNamePattern
      pattern: ^(first|last|full|given|family)_?name$|^ssn$|^dob$|ownership|birth|telephone|citizen|guarantor|signer
      weight: 15
      note: has person-like children
    - id: OWN-SIG-GOVID-SHAPE
      kind: valueShape
      appliesTo: GovernmentalIdentifier
      pattern: ^999-?99-?9999$|^9{4,15}$
      weight: 10
      note: digits, possibly dashed
    - id: OWN-SIG-PCT-RANGE
      kind: valueRange
      appliesTo: OwnershipPercent
      minValue: 0
      maxValue: 100
      weight: 10
      note: values between 0 and 100
    - id: OWN-SIG-PCT-TEXT
      kind: dataType
      appliesTo: OwnershipPercent
      pattern: string|date|dateTime|boolean
      weight: -30
      note: not a number
    - id: OWN-SIG-DOB-TYPE
      kind: dataType
      appliesTo: DateOfBirth
      pattern: date|dateTime
      weight: 10
      note: a date
    - id: OWN-SIG-PHONE-VALUE
      kind: valuePattern
      appliesTo: TelephoneNumber
      pattern: ^\+?[0-9 .()\-/]{7,20}$
      weight: 10
      note: digits, spaces, brackets and dashes
    - id: OWN-SIG-EMAIL
      kind: valuePattern
      appliesTo: Email
      pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      weight: 10
      note: looks like an e-mail address
    - id: OWN-SIG-ADDR-CHILDREN
      kind: childNamePattern
      appliesTo: Address
      pattern: ^(address[ _]?line[ _]?[123]|line[123]|street|city|state[ _]?province|state|province|country[ _]?region|country|postal[ _]?code|zip[ _]?code?|zip)$
      weight: 15
      note: children look like address parts
    - id: OWN-SIG-ADDR-OBJECT
      kind: dataType
      appliesTo: Address
      pattern: object
      weight: 10
      note: an address is a structured object
  derivations:
    - id: OWN-PCT-01
      description: Fraction (0–1) to percent (0–100).
      output:
        attribute: OwnershipPercent
        qualifiers:
          unit: percent
      inputs:
        - name: fraction
          attribute: OwnershipPercent
          qualifiers:
            unit: fraction
      expression: fraction * 100
      transformation: unitConversion
      examples:
        - inputs:
            fraction: 0.6
          expected: 60
        - inputs:
            fraction: 1
          expected: 100
    - id: OWN-PCT-02
      description: Percent (0–100) to fraction (0–1).
      output:
        attribute: OwnershipPercent
        qualifiers:
          unit: fraction
      inputs:
        - name: percent
          attribute: OwnershipPercent
          qualifiers:
            unit: percent
      expression: percent / 100
      transformation: unitConversion
      examples:
        - inputs:
            percent: 25
          expected: 0.25
    - id: OWN-NAME-01
      description: Full name is first name, a space, then last name.
      output:
        attribute: FullName
      inputs:
        - name: first
          attribute: FirstName
        - name: last
          attribute: LastName
      transformation: concat
    - id: OWN-NAME-02
      description: Split a full name at the last space into first and last name.
      output:
        attribute: FirstName
      inputs:
        - name: full
          attribute: FullName
      transformation: split
      dataLoss: medium
      requiresReview: true
      note: Middle names, suffixes and multi-word surnames split wrongly.
  validations:
    - id: OWN-VAL-01
      description: Total ownership cannot exceed 100%.
      inputs:
        - name: ownership
          attribute: OwnershipPercent
          qualifiers:
            unit: percent
      expression: sum(ownership) <= 100
      examples:
        - inputs:
            ownership:
              - 50
              - 30
              - 20
          expected: true
        - inputs:
            ownership:
              - 60
              - 50
          expected: false
    - id: OWN-VAL-02
      description: Owners together should own at least 25% (beneficial-ownership rule).
      severity: warning
      inputs:
        - name: ownership
          attribute: OwnershipPercent
          qualifiers:
            unit: percent
      expression: sum(ownership) >= 25
      examples:
        - inputs:
            ownership:
              - 10
          expected: false
        - inputs:
            ownership:
              - 100
          expected: true
  confidence: {}
  risks:
    - id: OWN-RISK-OFFICER
      level: high
      text: Officers and signers are not automatically owners; sending them as owners can misstate ownership.
    - id: OWN-RISK-GOVID
      appliesTo: GovernmentalIdentifier
      level: medium
      text: 'Sensitive: keep masked in documents and never send unmasked to AI.'
  reviewGuidance:
    - id: OWN-Q-RELATED
      when: nonEquivalentTerm
      question: The system's list is not called owners. Are all of these people beneficial owners (25%+)? If not, which ones should be sent as owners?
    - id: OWN-Q-PCT-UNIT
      appliesTo: OwnershipPercent
      when: qualifierConflict
      question: Is ownership sent as a fraction (0–1) or a percent (0–100)?
    - id: OWN-Q-PCT-MISSING
      appliesTo: OwnershipPercent
      when: nonEquivalentTerm
      question: Is this really the ownership share, or another percentage?
  aiGuidance: An owner is a person who owns or controls the merchant. Distinguish owners (hold equity) from officers, signers and guarantors (control or liability, possibly no equity). Never assume an officer is an owner. Ownership may be a fraction (0–1) or a percent (0–100); check observed values. Some systems send extra owner facts as name/value property bags (e.g. Position, OwnerPercentage, IndividualWithControl, UsCitizen, PersonalGuarantor, AppSigner) — map each entry by its name.
  # Fields this playbook must (or must not) recognise; a version can only be published when they pass.
  tests:
    - id: OWN-T-01
      description: A JSON owners list is the owner collection.
      field:
        name: owners
        ancestors:
          - $
        kind: object
        dataType: object
        cardinality: array
        children:
          - firstName
          - lastName
          - ssn
          - ownershipPercent
      expect: Owner
      minScore: 85
      expectReview: false
    - id: OWN-T-02
      description: An XML Officer list is owners, but needs review.
      field:
        name: Officer
        ancestors:
          - Officers
          - UnderwritingRequest
        kind: object
        dataType: object
        cardinality: array
        children:
          - FullName
          - SSN
          - OwnershipPct
      expect: Owner
      minScore: 60
      expectReview: true
    - id: OWN-T-03
      description: The wrapper element alone is not enough.
      field:
        name: Officers
        ancestors:
          - UnderwritingRequest
        kind: object
        dataType: object
        children:
          - Officer
      expect: null
    - id: OWN-T-04
      description: An owners entry with person-like children is the owner collection.
      field:
        name: Owners
        ancestors:
          - $
        kind: object
        dataType: object
        cardinality: array
        children:
          - FirstName
          - LastName
          - Suffix
          - GovernmentalIdentifier
          - DateOfBirth
          - TelephoneNumber
          - Address
          - DynamicProps
      expect: Owner
      minScore: 85
      expectReview: false
    - id: OWN-T-05
      description: A personal government id under owners is the owner's identifier.
      field:
        name: GovernmentalIdentifier
        ancestors:
          - Owners
          - $
        valueShapes:
          - "9999"
      expect: Owner.GovernmentalIdentifier
      minScore: 90
    - id: OWN-T-06
      description: Ownership named percent but sent as a fraction.
      field:
        name: ownershipPercent
        ancestors:
          - owners
          - $
        dataType: decimal
        minValue: 0.2
        maxValue: 1
      expect: Owner.OwnershipPercent
      expectQualifiers:
        unit: fraction
      expectReview: true
    - id: OWN-T-07
      description: Ownership sent as a percent.
      field:
        name: OwnershipPct
        ancestors:
          - Officer
          - Officers
        dataType: integer
        minValue: 20
        maxValue: 100
      expect: Owner.OwnershipPercent
      expectQualifiers:
        unit: percent
      expectReview: false
    - id: OWN-T-08
      description: First name needs an owner context.
      field:
        name: firstName
        ancestors:
          - owners
          - $
      expect: Owner.FirstName
      minScore: 80
    - id: OWN-T-09
      description: A business's legal name is not an owner's name.
      field:
        name: legalName
        ancestors:
          - account
          - $
      expect: null
    - id: OWN-T-10
      description: Date of birth.
      field:
        name: DateOfBirth
        ancestors:
          - Officer
          - Officers
        dataType: date
      expect: Owner.DateOfBirth
      minScore: 90
    - id: OWN-T-11
      description: OwnerPercentage inside a DynamicProps entry is the ownership share.
      field:
        name: OwnerPercentage
        ancestors:
          - DynamicProps
          - Owners
        dataType: integer
        minValue: 0
        maxValue: 100
      expect: Owner.OwnershipPercent
      expectQualifiers:
        unit: percent
    - id: OWN-T-12
      description: PersonalGuarantor flag inside DynamicProps.
      field:
        name: PersonalGuarantor
        ancestors:
          - DynamicProps
          - Owners
        dataType: boolean
      expect: Owner.PersonalGuarantor
      minScore: 80
    - id: OWN-T-13
      description: UsCitizen flag inside DynamicProps.
      field:
        name: UsCitizen
        ancestors:
          - DynamicProps
          - Owners
        dataType: boolean
      expect: Owner.UsCitizen
      minScore: 80
