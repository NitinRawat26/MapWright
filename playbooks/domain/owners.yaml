# Domain playbook: Owners.
# Edit a draft in the MapWright UI, or edit this file and check it with: mapwright playbook test playbooks
# Values that look like numbers or dates (versions, dates, codes) are quoted so every YAML tool reads them as text.

specVersion: "1.0"
id: domain/owners
name: Owners
kind: domain
version: "1.0.0"
status: published
owner: Underwriting BA team
description: 'People who own or control the merchant: owners, beneficial owners, officers, signers and guarantors. Similar but not always interchangeable.'
changeNotes:
  - version: "1.0.0"
    date: "2026-09-29"
    author: MapWright
    description: Replaces the principals playbook; adds owner contact details and control/citizenship/guarantor/signer flags.
domain:
  concept:
    name: Owner
    description: A person who owns or controls the merchant.
    cardinality: array
    attributes:
      - name: FullName
        dataType: string
        sensitivity: pii
        requiresContext: true
      - name: FirstName
        dataType: string
        sensitivity: pii
        requiresContext: true
      - name: LastName
        dataType: string
        sensitivity: pii
        requiresContext: true
      - name: Suffix
        description: Name suffix, e.g. Jr., III.
        dataType: string
        sensitivity: pii
        requiresContext: true
      - name: Title
        description: Job title or role, e.g. CEO, Managing Member, CTO.
        dataType: string
        requiresContext: true
      - name: OwnershipPercent
        description: Share of the business the person owns.
        dataType: decimal
      - name: GovernmentalIdentifier
        description: Government identifier for the person (e.g. SSN or national id).
        dataType: string
        sensitivity: sensitivePii
      - name: DateOfBirth
        dataType: date
        sensitivity: sensitivePii
      - name: TelephoneNumber
        description: The person's phone number.
        dataType: string
        sensitivity: pii
        requiresContext: true
      - name: Email
        dataType: string
        sensitivity: pii
        requiresContext: true
      - name: Address
        description: The person's residential or mailing address.
        dataType: object
        sensitivity: pii
      - name: IndividualWithControl
        description: Whether the person is a control person (significant responsibility over the business).
        dataType: boolean
      - name: UsCitizen
        description: Whether the person is a US citizen.
        dataType: boolean
      - name: PersonalGuarantor
        description: Whether the person personally guarantees the business's obligations.
        dataType: boolean
      - name: AppSigner
        description: Whether the person signs the application.
        dataType: boolean
  # Names systems use for the concept or one of its attributes; relation is equivalent unless stated.
  vocabulary:
    - term: owners
    - term: principals
    - term: business owners
    - term: beneficial owners
      relation: narrower
      note: Usually owners with 25% or more.
    - term: ubo
      relation: narrower
    - term: officers
      relation: related
      note: Officers run the business but may own nothing.
    - term: signers
      relation: related
    - term: authorized signers
      relation: related
    - term: guarantors
      relation: related
      note: Guarantors are liable for losses; they need not be owners.
    - term: control persons
      relation: related
    - term: directors
      relation: related
    - term: partners
      relation: related
    - term: members
      relation: related
    - term: contacts
      relation: related
    - term: full name
      appliesTo: FullName
    - term: principal name
      appliesTo: FullName
    - term: owner name
      appliesTo: FullName
    - term: officer name
      appliesTo: FullName
    - term: name
      appliesTo: FullName
      relation: related
    - term: first name
      appliesTo: FirstName
    - term: given name
      appliesTo: FirstName
    - term: fname
      appliesTo: FirstName
    - term: forename
      appliesTo: FirstName
    - term: last name
      appliesTo: LastName
    - term: surname
      appliesTo: LastName
    - term: family name
      appliesTo: LastName
    - term: lname
      appliesTo: LastName
    - term: suffix
      appliesTo: Suffix
    - term: name suffix
      appliesTo: Suffix
    - term: job title
      appliesTo: Title
    - term: position
      appliesTo: Title
    - term: designation
      appliesTo: Title
    - term: role
      appliesTo: Title
      relation: related
    - term: ownership percent
      appliesTo: OwnershipPercent
    - term: ownership pct
      appliesTo: OwnershipPercent
    - term: ownership percentage
      appliesTo: OwnershipPercent
    - term: owner percentage
      appliesTo: OwnershipPercent
    - term: percent owned
      appliesTo: OwnershipPercent
    - term: pct owned
      appliesTo: OwnershipPercent
    - term: equity percent
      appliesTo: OwnershipPercent
    - term: ownership
      appliesTo: OwnershipPercent
      relation: related
    - term: equity
      appliesTo: OwnershipPercent
      relation: related
    - term: share
      appliesTo: OwnershipPercent
      relation: related
    - term: social security number
      appliesTo: GovernmentalIdentifier
    - term: social security
      appliesTo: GovernmentalIdentifier
    - term: ssn
      appliesTo: GovernmentalIdentifier
    - term: ssn number
      appliesTo: GovernmentalIdentifier
    - term: governmental identifier
      appliesTo: GovernmentalIdentifier
    - term: government id
      appliesTo: GovernmentalIdentifier
    - term: national id
      appliesTo: GovernmentalIdentifier
      relation: related
    - term: dob
      appliesTo: DateOfBirth
    - term: date of birth
      appliesTo: DateOfBirth
    - term: birth date
      appliesTo: DateOfBirth
    - term: birthday
      appliesTo: DateOfBirth
    - term: phone
      appliesTo: TelephoneNumber
      relation: related
    - term: telephone
      appliesTo: TelephoneNumber
    - term: telephone number
      appliesTo: TelephoneNumber
    - term: phone number
