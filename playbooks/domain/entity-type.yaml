# Domain playbook: Entity Type.
# Edit a draft in the MapWright UI, or edit this file and check it with: mapwright playbook test playbooks
# Values that look like numbers or dates (versions, dates, codes) are quoted so every YAML tool reads them as text.

specVersion: "1.0"
id: domain/entity-type
name: Entity Type
kind: domain
version: "1.0.0"
status: published
owner: Underwriting BA team
description: The merchant's legal structure and the codes different systems use for it.
changeNotes:
  - version: "1.0.0"
    date: "2026-09-25"
    author: MapWright starter set
    description: Initial version.
domain:
  concept:
    name: LegalEntity
    description: The business being boarded.
    attributes:
      - name: EntityType
        description: Legal structure of the business.
        dataType: string
  # Names systems use for the concept or one of its attributes; relation is equivalent unless stated.
  vocabulary:
    - term: merchant
    - term: legal entity
    - term: business
    - term: company
    - term: account
      relation: related
    - term: organization
      relation: related
    - term: customer
      relation: related
    - term: entity type
      appliesTo: EntityType
    - term: business type
      appliesTo: EntityType
    - term: legal structure
      appliesTo: EntityType
    - term: ownership type
      appliesTo: EntityType
    - term: organization type
      appliesTo: EntityType
    - term: org type
      appliesTo: EntityType
    - term: company type
      appliesTo: EntityType
    - term: legal entity type
      appliesTo: EntityType
    - term: business structure
      appliesTo: EntityType
    - term: entity structure
      appliesTo: EntityType
    - term: legal form
      appliesTo: EntityType
    - term: incorporation type
      appliesTo: EntityType
      relation: related
    - term: structure
      appliesTo: EntityType
      relation: related
  # Extra evidence: each matching signal adds its weight (negative weights count against a match).
  signals:
    - id: ENT-SIG-CODES
      kind: valueInMap
      appliesTo: EntityType
      pattern: ENTITY-TYPES
      weight: 20
      note: values are known entity-type codes
  valueMaps:
    - id: ENTITY-TYPES
      attribute: EntityType
      values:
        - code: SOLE_PROPRIETORSHIP
          label: Sole proprietorship
          aliases:
            - SP
            - SOLE_PROP
            - SOLEPROP
            - Sole Proprietor
            - Individual
            - IND
        - code: PARTNERSHIP
          label: General partnership
          aliases:
            - P
            - GP
            - PART
            - PRTNR
            - General Partnership
        - code: LIMITED_PARTNERSHIP
          label: Limited partnership
          aliases:
            - LP
            - LLP
            - Limited Liability Partnership
        - code: LLC
          label: Limited liability company
          aliases:
            - L
            - L.L.C.
            - LIMITED_LIABILITY_CO
            - Limited Liability Co
        - code: CORPORATION
          label: Private corporation
          aliases:
            - C
            - CORP
            - INC
            - C_CORP
            - Private Corporation
        - code: S_CORPORATION
          label: S corporation
          aliases:
            - S
            - S_CORP
            - SCORP
        - code: PUBLIC_CORPORATION
          label: Publicly traded corporation
          aliases:
            - PUB
            - PUBLIC
            - Publicly Traded
            - PUBCO
        - code: NON_PROFIT
          label: Non-profit organization
          aliases:
            - NP
            - NPO
            - NONPROFIT
            - "501c3"
            - Tax Exempt
        - code: GOVERNMENT
          label: Government entity
          aliases:
            - G
            - GOV
            - GOVT
            - Government Agency
        - code: TRUST
          label: Trust
          aliases:
            - T
            - TR
  confidence: {}
  risks:
    - id: ENT-RISK-UNMAPPED
      appliesTo: EntityType
      level: medium
      text: Codes with no entry in the value map must be mapped by a reviewer; a wrong type changes underwriting rules and required documents.
  reviewGuidance:
    - id: ENT-Q-PARTNER
      appliesTo: EntityType
      question: Does the source separate general and limited partnerships, and S corporations from C corporations?
  aiGuidance: Entity type is the legal structure (sole proprietorship, partnership, LLC, corporation, non-profit, government, trust). Systems use short codes (C, SP) or long labels; map each to the canonical code list.
  # Fields this playbook must (or must not) recognise; a version can only be published when they pass.
  tests:
    - id: ENT-T-01
      description: Sales-system entity type with long codes.
      field:
        name: entityType
        ancestors:
          - account
          - $
        values:
          - CORP
          - LLC
          - SOLE_PROP
      expect: LegalEntity.EntityType
      minScore: 90
    - id: ENT-T-02
      description: Underwriting ownership type with one-letter codes.
      field:
        name: OwnershipType
        ancestors:
          - Merchant
          - UnderwritingRequest
        values:
          - C
          - SP
      expect: LegalEntity.EntityType
      minScore: 90
    - id: ENT-T-03
      description: Legal structure code.
      field:
        name: legalStructureCd
        values:
          - LLC
          - NPO
      expect: LegalEntity.EntityType
      minScore: 80
    - id: ENT-T-04
      description: A merchant category is not an entity type.
      field:
        name: merchantCategory
        ancestors:
          - account
        values:
          - RETAIL
          - RESTAURANT
      expect: null
