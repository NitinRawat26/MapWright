<mat-toolbar class="toolbar">
  <a routerLink="/" class="brand">MapWright</a>
  <span class="spacer"></span>
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="user">
    <mat-label>Your name</mat-label>
    <input matInput data-testid="user" [ngModel]="user.name()" (change)="user.set($any($event.target).value)" />
  </mat-form-field>
  @if (!user.name()) {
    <span class="hint">Enter your name to make changes</span>
  }
  <a mat-button href="/swagger" target="_blank" rel="noopener">API</a>
</mat-toolbar>
<mat-sidenav-container class="container">
  <mat-sidenav mode="side" opened class="nav">
    <nav>
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.exact }">{{ link.label }}</a>
      }
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
